target_dir = "scratch/git_clones"
fetch_method = "git_bare_clone"

[datasets.tier_1_spec]
description = "281 multi-regime shared AIDev repositories (hosting both reviewed and silent merged PRs) + active Jev adopter repositories"
clone_flags = ["--bare", "--filter=blob:none"]
jev_core_repos = [
  "getsentry/sentry",
  "craftmilldev/sesh",
  "craftmilldev/loopway",
  "mirrorstack-ai/mirrorstack-cli",
  "fabiankaegy/pr-risk",
  "BerriAI/litellm",
]
fallback_csv = "results/data_tables/analyzed_repositories_log.csv"

