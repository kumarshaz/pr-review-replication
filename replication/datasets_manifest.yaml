  - id: "DS-07_jev_pr_reviews"
    name: "TypeSafe Jev Decision-Model PR Reviews & Paired Controls (26 Adopter Repos)"
    target_dir: "scratch/jev_pr_reviews"
    fetch_method: "local_or_miner"
