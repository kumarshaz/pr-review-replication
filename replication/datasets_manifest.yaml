        expected_rows: 6055
      jev_bot_signals_and_comments.parquet:
        min_rows: 10000
      jev_formal_reviews.parquet:
        min_rows: 900
      jev_git_commits.parquet:
        min_rows: 1900

  - id: "DS-08_tier1_git_clones"
    name: "Tier-1 Bare Git Clones for Commit-Attributed SZZ & Cold-File Baselines"
    target_dir: "scratch/git_clones"
    fetch_method: "git_bare_clone"
    tier_1_spec:
      description: "281 multi-regime shared AIDev repositories + 26 TypeSafe Jev adopter repositories (300 local bare-git clones)"
      clone_flags: ["--bare", "--filter=blob:none"]
      jev_core_repos:
        - "getsentry/sentry"
        - "craftmilldev/sesh"
        - "craftmilldev/loopway"
        - "mirrorstack-ai/mirrorstack-cli"
        - "Tgenz1213/ArchGuard"
        - "marufeuille/xteink-read-later"
      fallback_csv: "replication/results/pr_review/data_tables/analyzed_repositories_log.csv"
